# PostgreSQL: pojedyncza instancja (StatefulSet + PVC). Świadome ograniczenie opisane w pracy;
# ścieżka rozwoju: PgBouncer, repliki do odczytu albo zarządzana baza w chmurze.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "ticketline.labels" . | nindent 4 }}
spec:
  selector: {{- include "ticketline.selector" (dict "component" "postgres") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "ticketline.labels" . | nindent 4 }}
    {{- include "ticketline.selector" (dict "component" "postgres") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "ticketline.selector" (dict "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ticketline.selector" (dict "component" "postgres") | nindent 8 }}
      annotations:
        # Zmiana init.sql zmienia hash -> restart poda (ale schemat wykona się tylko na pustym PVC).
        checksum/init-sql: {{ .Values.postgres.initSql | sha256sum }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: ["-c", "max_connections={{ .Values.postgres.maxConnections }}"]
          env:
            - name: POSTGRES_DB
              value: {{ .Values.db.name }}
            - name: POSTGRES_USER
              value: {{ .Values.db.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: ticketline-secrets, key: postgres-password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.db.user }}", "-d", "{{ .Values.db.name }}"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.db.user }}", "-d", "{{ .Values.db.name }}"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
