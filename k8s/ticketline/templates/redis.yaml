# Redis: kolejka (Redis Streams) i statusy rezerwacji. Pojedyncza instancja z AOF na PVC.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "ticketline.labels" . | nindent 4 }}
spec:
  selector: {{- include "ticketline.selector" (dict "component" "redis") | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "ticketline.labels" . | nindent 4 }}
    {{- include "ticketline.selector" (dict "component" "redis") | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {{- include "ticketline.selector" (dict "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ticketline.selector" (dict "component" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          {{- if .Values.redis.appendOnly }}
          args: ["--appendonly", "yes", "--appendfsync", "everysec"]
          {{- end }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
